name: Migrate user socials link
on:
  workflow_dispatch:
    inputs:
      environment-name:
        required: true
        description: The environment name
        type: choice
        options:
          - Branch
          - Development
          - Production
      contentful-env:
        required: true
        type: string
        description: Choose the Contentful environment to link user socials

jobs:
  migrate_user_socials_link:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment-name }}
    container:
      image: ghcr.io/yldio/asap-hub/node-python-sq:92bd02a49ed4fd0c99c86d1966869791bc1530fe
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        id: setup
        uses: ./.github/actions/setup-environment
        with:
          environment-name: ${{ inputs.environment-name }}
      - name: Run User Socials Link Migration
        run: |
          yarn workspace @asap-hub/contentful migrate-user-socials-link
        env:
          CONTENTFUL_MANAGEMENT_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}
          CONTENTFUL_SPACE_ID: ${{ steps.setup.outputs.crn-contentful-space-id }}
          CONTENTFUL_ENV_ID: ${{ inputs.contentful-env }}
      - name: Verify User Socials Link Migration
        run: |
          yarn workspace @asap-hub/contentful verify-user-socials-link
        env:
          CONTENTFUL_MANAGEMENT_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}
          CONTENTFUL_SPACE_ID: ${{ steps.setup.outputs.crn-contentful-space-id }}
          CONTENTFUL_ENV_ID: ${{ inputs.contentful-env }}

  notify_failure:
    runs-on: ubuntu-latest
    needs: [migrate_user_socials_link]
    if: ${{ failure() && inputs.environment-name=='Production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/slack/
        with:
          message: Migrate user socials link failed
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          status: failure
